name: Dependency audit

# Checks the runtime dependencies for known vulnerabilities (OSV database, which
# includes the PyPI and GitHub advisories). The plugin ships version ranges, not
# pins, so two resolutions are audited:
#   highest        - what a fresh `pip install certbot-dns-azure-modern` gets today
#   lowest-direct  - the declared lower bounds in setup.py; pip keeps an older,
#                    already installed version that satisfies the bound, so a bound
#                    that admits a vulnerable release has to be raised
# A scheduled run that finds something opens (or comments on) an issue.

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "setup.py"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit (py${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Resolve dependencies
        run: |
          uv pip compile setup.py --python-version ${{ matrix.python }} \
            --resolution ${{ matrix.resolution }} --no-header -o resolved.txt
          cat resolved.txt
      - name: Audit
        run: |
          set +e
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r resolved.txt \
            --vulnerability-service osv --progress-spinner off -f markdown -o audit.md
          rc=$?
          set -e
          {
            echo "### py${{ matrix.python }}, ${{ matrix.resolution }}"
            if [ "$rc" -eq 0 ]; then
              echo "No known vulnerabilities."
            else
              cat audit.md
            fi
            echo
            echo "<details><summary>Resolved versions</summary>"
            echo
            echo '```'
            cat resolved.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  report:
    name: Open issue
    needs: audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dependency audit found known vulnerabilities"
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing in $RUN_URL"
          else
            gh issue create --title "$title" --label bug --body "The weekly dependency audit failed: $RUN_URL

          The job summary lists the affected packages and fix versions. A finding in a
          \`highest\` run means the latest release of a dependency is vulnerable; a finding
          only in \`lowest-direct\` means a lower bound in \`setup.py\` still admits a
          vulnerable release and has to be raised.

          Close this issue once the audit is green again."
          fi
