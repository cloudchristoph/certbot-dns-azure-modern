name: Dependency audit

# Checks the runtime dependencies for known vulnerabilities (OSV database, which
# includes the PyPI and GitHub advisories). The plugin ships version ranges, not
# pins, so two resolutions are audited:
#   highest        - what a fresh `pip install certbot-dns-azure-modern` gets today
#   lowest-direct  - the declared lower bounds in setup.py; pip keeps an older,
#                    already installed version that satisfies the bound, so a bound
#                    that admits a vulnerable release has to be raised
# A failing scheduled run opens (or comments on) an issue. Findings and operational
# errors (resolution, OSV unreachable) get separate issues.

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "setup.py"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit (py${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Resolve dependencies
        run: |
          uv pip compile setup.py --python-version ${{ matrix.python }} \
            --resolution ${{ matrix.resolution }} --no-header -o resolved.txt
          cat resolved.txt
      - name: Audit
        run: |
          set +e
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r resolved.txt \
            --vulnerability-service osv --progress-spinner off -f json -o audit.json
          rc=$?
          set -e
          count=0
          if [ -s audit.json ]; then
            count=$(jq '[.dependencies[].vulns[]] | length' audit.json)
          fi
          label="py${{ matrix.python }}, ${{ matrix.resolution }}"
          {
            echo "### $label"
            if [ "$count" -gt 0 ]; then
              echo "| Package | Version | Advisory | Fix versions |"
              echo "| --- | --- | --- | --- |"
              jq -r '.dependencies[] | .name as $n | .version as $v | .vulns[]
                | "| \($n) | \($v) | \(([.id] + .aliases) | join(", ")) | \(.fix_versions | join(", ")) |"' \
                audit.json | sort -u
            fi
          } > findings.md
          if [ "$count" -gt 0 ]; then
            cat findings.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 0 ]; then
            echo "### $label"$'\n'"No known vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
            rm findings.md
          else
            echo "### $label"$'\n'"pip-audit failed (exit $rc) without reporting a vulnerability, see the job log." >> "$GITHUB_STEP_SUMMARY"
            rm findings.md
          fi
          {
            echo
            echo "<details><summary>Resolved versions</summary>"
            echo
            echo '```'
            cat resolved.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Keep findings for the report
        if: failure() && hashFiles('findings.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: findings-py${{ matrix.python }}-${{ matrix.resolution }}
          path: findings.md
          retention-days: 7

  report:
    name: Open issue
    needs: audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Collect findings
        # No artifact means every failure was operational, not a vulnerability.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if compgen -G "findings/*/findings.md" > /dev/null; then
            title="Dependency audit found known vulnerabilities"
            {
              echo "The weekly dependency audit found known vulnerabilities: $RUN_URL"
              echo
              cat findings/*/findings.md
              echo
              echo "A finding in a \`highest\` run means the latest release of a dependency is"
              echo "vulnerable. A finding only in \`lowest-direct\` means a lower bound in"
              echo "\`setup.py\` still admits a vulnerable release and has to be raised."
              echo
              echo "Close this issue once the audit is green again."
            } > body.md
          else
            title="Dependency audit failed"
            {
              echo "The weekly dependency audit failed without reporting a vulnerability"
              echo "(dependency resolution or the OSV service): $RUN_URL"
              echo
              echo "Check the job logs, re-run the workflow, and close this issue once it is green."
            } > body.md
          fi
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --label bug --body-file body.md
          fi
