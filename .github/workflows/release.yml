name: Release

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (py${{ matrix.python }}, ${{ matrix.certbot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        certbot: ["certbot"]
        include:
          # oldest supported line; acme 3.x still needs pyOpenSSL < 26
          - python: "3.11"
            certbot: "'certbot>=3.0,<4.0' 'pyOpenSSL<26'"
          - python: "3.12"
            certbot: "'certbot>=3.0,<4.0' 'pyOpenSSL<26'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # unquoted on purpose: the matrix value carries its own shell quoting
          python -m pip install ${{ matrix.certbot }}
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Show resolved versions
        run: python -m pip list | grep -iE '^(acme|certbot|josepy|pyopenssl|cryptography|azure-mgmt-dns) '
      - name: Test
        run: pytest -rA tests/
      - name: Plugin is discoverable by certbot
        run: certbot plugins --text | grep -A1 'dns-azure'

  azure_test:
    name: Azure Test
    # Real certificate issuance (Let's Encrypt staging) against dedicated Azure DNS
    # test zones, see azure_tests/integration_test.py for the expected setup.
    # Enable by setting the repository variable RUN_AZURE_TESTS=true; the
    # environment dev.azure holds the AZURE_* secrets and the DNS variables.
    # Runs on main, on tags and on manual dispatch, not on every branch push.
    # Only one run may use the test zones at a time: parallel runs (e.g. a push to
    # main and a tag push seconds later) delete each other's TXT records.
    if: >-
      vars.RUN_AZURE_TESTS == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))))
    concurrency:
      group: azure-tests
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: dev.azure
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 'Az CLI Login via OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Test
        run: pytest -rA azure_tests/
        env:
          EMAIL: ${{ vars.EMAIL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_DNS_RESOURCE_GROUP: ${{ vars.AZURE_DNS_RESOURCE_GROUP }}
          AZURE_DNS_TEST_DOMAIN: ${{ vars.AZURE_DNS_TEST_DOMAIN }}

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        # Read the version from the built sdist name; the runner's Python has no setuptools.
        run: |
          sdist=$(ls dist/*.tar.gz)
          v=${sdist##*-}; v=${v%.tar.gz}
          echo "built $sdist -> version $v, tag ${GITHUB_REF_NAME}"
          test "$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version $v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    # On a tag, wait for the Azure test as well; a skipped Azure test (variable
    # not set) does not block the release, a failed one does.
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      needs.azure_test.result != 'failure'
    needs: [build, azure_test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/certbot-dns-azure-modern
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: write   # GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
